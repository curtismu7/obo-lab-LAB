# OrbStack:  HOST_PORT=7560 docker compose up --build -d   ->  http://127.0.0.1:7560
# The server binds 0.0.0.0 INSIDE the container (OBOL_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 7560-7569.
name: obo-lab

services:
  obo-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-7560}:7560"
    environment:
      PORT: "7560"
      OBOL_BIND: 0.0.0.0
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-obo-lab.local.ping-devops.com}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7560/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
